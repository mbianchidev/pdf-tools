services:
  postgres:
    image: postgres:18-alpine
    container_name: pdf-tools-postgres
    environment:
      POSTGRES_DB: pdftools
      POSTGRES_USER: pdftools
      POSTGRES_PASSWORD: pdftools
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - pdf-tools-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdftools -d pdftools"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: pdf-tools-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf-tools-backend
    ports:
      - "127.0.0.1:8080:8080"
    pids_limit: 256
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=jdbc:postgresql://postgres:5432/pdftools
      - DATABASE_USERNAME=pdftools
      - DATABASE_PASSWORD=pdftools
      - PDF_UPLOAD_DIR=${PDF_UPLOAD_DIR:-/tmp/pdf-storage/legacy}
      - PDF_STORAGE_TYPE=${PDF_STORAGE_TYPE:-local}
      - PDF_STORAGE_LOCAL_ROOT=${PDF_STORAGE_LOCAL_ROOT:-/tmp/pdf-storage/jobs}
      - PDF_STORAGE_S3_ENDPOINT=${PDF_STORAGE_S3_ENDPOINT:-}
      - PDF_STORAGE_S3_REGION=${PDF_STORAGE_S3_REGION:-us-east-1}
      - PDF_STORAGE_S3_BUCKET=${PDF_STORAGE_S3_BUCKET:-pdf-tools}
      - PDF_STORAGE_S3_ACCESS_KEY=${PDF_STORAGE_S3_ACCESS_KEY:-}
      - PDF_STORAGE_S3_SECRET_KEY=${PDF_STORAGE_S3_SECRET_KEY:-}
      - PDF_STORAGE_S3_PATH_STYLE_ACCESS=${PDF_STORAGE_S3_PATH_STYLE_ACCESS:-true}
      - PDF_STORAGE_S3_CREATE_BUCKET=${PDF_STORAGE_S3_CREATE_BUCKET:-false}
      - PDF_OPTIONS_ENCRYPTION_KEY=${PDF_OPTIONS_ENCRYPTION_KEY:-}
      - PDF_SECURITY_MAX_OUTPUT_BYTES=${PDF_SECURITY_MAX_OUTPUT_BYTES:-134217728}
      - PDF_ENABLED_OPERATIONS=${PDF_ENABLED_OPERATIONS:-merge,split,remove,rotate,organize,crop,page-numbers,protect,unlock,pdf-to-jpg,jpg-to-pdf,watermark,edit,redact,word-to-pdf,powerpoint-to-pdf,excel-to-pdf}
      - PDF_TO_JPG_MAX_DOCUMENT_PAGES=${PDF_TO_JPG_MAX_DOCUMENT_PAGES:-1000}
      - PDF_TO_JPG_MAX_SELECTED_PAGES=${PDF_TO_JPG_MAX_SELECTED_PAGES:-500}
      - PDF_TO_JPG_MAX_DPI=${PDF_TO_JPG_MAX_DPI:-300}
      - PDF_TO_JPG_MAX_PIXELS_PER_PAGE=${PDF_TO_JPG_MAX_PIXELS_PER_PAGE:-20000000}
      - PDF_TO_JPG_MAX_IMAGE_BYTES=${PDF_TO_JPG_MAX_IMAGE_BYTES:-52428800}
      - PDF_TO_JPG_MAX_TOTAL_IMAGE_BYTES=${PDF_TO_JPG_MAX_TOTAL_IMAGE_BYTES:-536870912}
      - PDF_TO_JPG_MAX_ARCHIVE_BYTES=${PDF_TO_JPG_MAX_ARCHIVE_BYTES:-545259520}
      - PDF_TO_JPG_MAX_WORKER_HEAP_BYTES=${PDF_TO_JPG_MAX_WORKER_HEAP_BYTES:-268435456}
      - PDF_TO_JPG_WORKER_TIMEOUT=${PDF_TO_JPG_WORKER_TIMEOUT:-5m}
      - JPG_TO_PDF_MAX_IMAGES=${JPG_TO_PDF_MAX_IMAGES:-100}
      - JPG_TO_PDF_MAX_IMAGE_DIMENSION=${JPG_TO_PDF_MAX_IMAGE_DIMENSION:-16384}
      - JPG_TO_PDF_MAX_PIXELS_PER_IMAGE=${JPG_TO_PDF_MAX_PIXELS_PER_IMAGE:-50000000}
      - JPG_TO_PDF_MAX_TOTAL_PIXELS=${JPG_TO_PDF_MAX_TOTAL_PIXELS:-500000000}
      - JPG_TO_PDF_MAX_OUTPUT_BYTES=${JPG_TO_PDF_MAX_OUTPUT_BYTES:-134217728}
      - JPG_TO_PDF_MAX_PROGRESSIVE_COEFFICIENT_BYTES=${JPG_TO_PDF_MAX_PROGRESSIVE_COEFFICIENT_BYTES:-67108864}
      - JPG_TO_PDF_VALIDATION_WORKER_HEAP_BYTES=${JPG_TO_PDF_VALIDATION_WORKER_HEAP_BYTES:-134217728}
      - JPG_TO_PDF_VALIDATION_WORKER_TIMEOUT=${JPG_TO_PDF_VALIDATION_WORKER_TIMEOUT:-2m}
      - WATERMARK_MAX_IMAGE_BYTES=${WATERMARK_MAX_IMAGE_BYTES:-10485760}
      - WATERMARK_MAX_IMAGE_DIMENSION=${WATERMARK_MAX_IMAGE_DIMENSION:-4096}
      - WATERMARK_MAX_IMAGE_PIXELS=${WATERMARK_MAX_IMAGE_PIXELS:-4000000}
      - EDIT_MAX_ELEMENTS=${EDIT_MAX_ELEMENTS:-500}
      - EDIT_MAX_IMAGES=${EDIT_MAX_IMAGES:-10}
      - EDIT_MAX_IMAGE_BYTES=${EDIT_MAX_IMAGE_BYTES:-10485760}
      - EDIT_MAX_TOTAL_DECODED_IMAGE_BYTES=${EDIT_MAX_TOTAL_DECODED_IMAGE_BYTES:-67108864}
      - REDACT_MAX_AREAS=${REDACT_MAX_AREAS:-500}
      - REDACT_MAX_AREAS_PER_PAGE=${REDACT_MAX_AREAS_PER_PAGE:-100}
      - REDACT_MAX_DOCUMENT_PAGES=${REDACT_MAX_DOCUMENT_PAGES:-1000}
      - REDACT_RENDER_DPI=${REDACT_RENDER_DPI:-200}
      - REDACT_JPEG_QUALITY=${REDACT_JPEG_QUALITY:-95}
      - REDACT_MAX_PIXELS_PER_PAGE=${REDACT_MAX_PIXELS_PER_PAGE:-20000000}
      - REDACT_MAX_IMAGE_DIMENSION=${REDACT_MAX_IMAGE_DIMENSION:-16384}
      - REDACT_MAX_IMAGE_BYTES=${REDACT_MAX_IMAGE_BYTES:-52428800}
      - REDACT_MAX_TOTAL_IMAGE_BYTES=${REDACT_MAX_TOTAL_IMAGE_BYTES:-536870912}
      - REDACT_MAX_OUTPUT_BYTES=${REDACT_MAX_OUTPUT_BYTES:-536870912}
      - REDACT_WORKER_HEAP_BYTES=${REDACT_WORKER_HEAP_BYTES:-268435456}
      - REDACT_WORKER_TIMEOUT=${REDACT_WORKER_TIMEOUT:-5m}
      - OFFICE_LIBREOFFICE_BINARY=${OFFICE_LIBREOFFICE_BINARY:-/usr/bin/soffice}
      - OFFICE_CONVERSION_MODE=queue
      - OFFICE_QUEUE_REQUEST_ROOT=/var/lib/pdf-tools-office/requests
      - OFFICE_QUEUE_RESPONSE_ROOT=/var/lib/pdf-tools-office/responses
      - OFFICE_QUEUE_SIGNAL_ROOT=/var/lib/pdf-tools-office/signals
      - OFFICE_QUEUE_WAIT_TIMEOUT=${OFFICE_QUEUE_WAIT_TIMEOUT:-5m}
      - OFFICE_QUEUE_RETENTION=${OFFICE_QUEUE_RETENTION:-1h}
      - OFFICE_QUEUE_CLEANUP_INTERVAL=${OFFICE_QUEUE_CLEANUP_INTERVAL:-1m}
      - OFFICE_MAX_INPUT_BYTES=${OFFICE_MAX_INPUT_BYTES:-52428800}
      - OFFICE_MAX_EXPANDED_INPUT_BYTES=${OFFICE_MAX_EXPANDED_INPUT_BYTES:-268435456}
      - OFFICE_MAX_ARCHIVE_ENTRIES=${OFFICE_MAX_ARCHIVE_ENTRIES:-10000}
      - OFFICE_MAX_OUTPUT_BYTES=${OFFICE_MAX_OUTPUT_BYTES:-134217728}
      - OFFICE_MAX_LOG_BYTES=${OFFICE_MAX_LOG_BYTES:-1048576}
      - OFFICE_MAX_ADDRESS_SPACE_BYTES=${OFFICE_MAX_ADDRESS_SPACE_BYTES:-1073741824}
      - OFFICE_CPU_TIME_SECONDS=${OFFICE_CPU_TIME_SECONDS:-120}
      - OFFICE_MAX_OPEN_FILES=${OFFICE_MAX_OPEN_FILES:-256}
      - OFFICE_MAX_WORKER_PROCESSES=${OFFICE_MAX_WORKER_PROCESSES:-96}
      - OFFICE_WALL_TIMEOUT=${OFFICE_WALL_TIMEOUT:-2m}
      - EXCEL_MAX_SHEETS=${EXCEL_MAX_SHEETS:-100}
      - EXCEL_MAX_USED_CELLS=${EXCEL_MAX_USED_CELLS:-1000000}
      - EXCEL_MAX_PREPARED_BYTES=${EXCEL_MAX_PREPARED_BYTES:-104857600}
      - EXCEL_PREPARATION_WORKER_HEAP_BYTES=${EXCEL_PREPARATION_WORKER_HEAP_BYTES:-536870912}
      - EXCEL_PREPARATION_WORKER_ADDRESS_SPACE_BYTES=${EXCEL_PREPARATION_WORKER_ADDRESS_SPACE_BYTES:-2147483648}
      - EXCEL_PREPARATION_WORKER_TIMEOUT=${EXCEL_PREPARATION_WORKER_TIMEOUT:-2m}
      - CORS_ALLOWED_ORIGINS=http://localhost:80,http://localhost:3000
    volumes:
      - pdf-storage:/tmp/pdf-storage
      - office-requests:/var/lib/pdf-tools-office/requests
      - office-responses:/var/lib/pdf-tools-office/responses:ro
      - office-signals:/var/lib/pdf-tools-office/signals
    networks:
      - pdf-tools-network
    depends_on:
      postgres:
        condition: service_healthy
      office-converter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/pdf/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  office-converter:
    image: pdf-tools-backend:local
    init: true
    container_name: pdf-tools-office-converter
    command:
      - java
      - -Dloader.main=com.pdftools.operations.office.OfficeConverterDaemonMain
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    network_mode: none
    environment:
      - PDF_TOOLS_RUN_AS_ROOT=true
      - OFFICE_QUEUE_REQUEST_ROOT=/var/lib/pdf-tools-office/requests
      - OFFICE_QUEUE_RESPONSE_ROOT=/var/lib/pdf-tools-office/responses
      - OFFICE_QUEUE_SIGNAL_ROOT=/var/lib/pdf-tools-office/signals
      - OFFICE_QUEUE_RETENTION=${OFFICE_QUEUE_RETENTION:-1h}
      - OFFICE_SIDECAR_WORK_ROOT=/tmp/office-work
      - OFFICE_WORKER_USER=officeworker
      - OFFICE_LIBREOFFICE_BINARY=${OFFICE_LIBREOFFICE_BINARY:-/usr/bin/soffice}
      - OFFICE_MAX_INPUT_BYTES=${OFFICE_MAX_INPUT_BYTES:-52428800}
      - OFFICE_MAX_EXPANDED_INPUT_BYTES=${OFFICE_MAX_EXPANDED_INPUT_BYTES:-268435456}
      - OFFICE_MAX_ARCHIVE_ENTRIES=${OFFICE_MAX_ARCHIVE_ENTRIES:-10000}
      - OFFICE_MAX_OUTPUT_BYTES=${OFFICE_MAX_OUTPUT_BYTES:-134217728}
      - OFFICE_MAX_LOG_BYTES=${OFFICE_MAX_LOG_BYTES:-1048576}
      - OFFICE_MAX_ADDRESS_SPACE_BYTES=${OFFICE_MAX_ADDRESS_SPACE_BYTES:-1073741824}
      - OFFICE_CPU_TIME_SECONDS=${OFFICE_CPU_TIME_SECONDS:-120}
      - OFFICE_MAX_OPEN_FILES=${OFFICE_MAX_OPEN_FILES:-256}
      - OFFICE_MAX_WORKER_PROCESSES=${OFFICE_MAX_WORKER_PROCESSES:-96}
      - OFFICE_WALL_TIMEOUT=${OFFICE_WALL_TIMEOUT:-2m}
      - EXCEL_MAX_SHEETS=${EXCEL_MAX_SHEETS:-100}
      - EXCEL_MAX_USED_CELLS=${EXCEL_MAX_USED_CELLS:-1000000}
      - EXCEL_MAX_PREPARED_BYTES=${EXCEL_MAX_PREPARED_BYTES:-104857600}
      - EXCEL_PREPARATION_WORKER_HEAP_BYTES=${EXCEL_PREPARATION_WORKER_HEAP_BYTES:-536870912}
      - EXCEL_PREPARATION_WORKER_ADDRESS_SPACE_BYTES=${EXCEL_PREPARATION_WORKER_ADDRESS_SPACE_BYTES:-2147483648}
      - EXCEL_PREPARATION_WORKER_TIMEOUT=${EXCEL_PREPARATION_WORKER_TIMEOUT:-2m}
    volumes:
      - office-requests:/var/lib/pdf-tools-office/requests:ro
      - office-responses:/var/lib/pdf-tools-office/responses
      - office-signals:/var/lib/pdf-tools-office/signals:ro
    mem_limit: 1200m
    cpus: 2.0
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    tmpfs:
      - /tmp/office-work:size=768m,mode=0711
    healthcheck:
      test: ["CMD", "test", "-f", "/var/lib/pdf-tools-office/responses/.daemon-ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf-tools-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pdf-tools-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  startup-message:
    image: alpine:latest
    container_name: pdf-tools-startup-message
    depends_on:
      frontend:
        condition: service_healthy
    command: >
      /bin/sh -c "echo '' && echo '========================================' && echo '  PDF Tools is ready!' && echo '  Access the app at: http://localhost:80' && echo '========================================' && echo ''"
    networks:
      - pdf-tools-network

  seaweed-master:
    image: chrislusf/seaweedfs:4.44
    profiles: ["s3"]
    command: master -ip=seaweed-master -mdir=/data
    volumes:
      - seaweed-master-data:/data
    networks:
      - pdf-tools-network

  seaweed-volume:
    image: chrislusf/seaweedfs:4.44
    profiles: ["s3"]
    command: volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=0
    depends_on:
      - seaweed-master
    volumes:
      - seaweed-volume-data:/data
    networks:
      - pdf-tools-network

  seaweed-filer:
    image: chrislusf/seaweedfs:4.44
    profiles: ["s3"]
    command: filer -master=seaweed-master:9333 -ip=seaweed-filer
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed-filer-data:/data
    networks:
      - pdf-tools-network

  seaweed-s3:
    image: chrislusf/seaweedfs:4.44
    profiles: ["s3"]
    command: s3 -filer=seaweed-filer:8888 -port=8333
    depends_on:
      - seaweed-filer
    ports:
      - "127.0.0.1:8333:8333"
    networks:
      - pdf-tools-network

networks:
  pdf-tools-network:
    driver: bridge

volumes:
  pdf-storage:
    driver: local
  office-requests:
    driver: local
  office-responses:
    driver: local
  office-signals:
    driver: local
  postgres-data:
    driver: local
  seaweed-master-data:
    driver: local
  seaweed-volume-data:
    driver: local
  seaweed-filer-data:
    driver: local
