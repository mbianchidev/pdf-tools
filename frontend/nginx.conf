server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Increase buffer sizes for large headers/cookies
    large_client_header_buffers 4 32k;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 2h;
        add_header X-Accel-Buffering no;
    }

    location /api/v1/ {
        error_page 413 = @v1_upload_too_large;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 2h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/pdf/ {
        error_page 413 = @legacy_upload_too_large;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @v1_upload_too_large {
        default_type application/json;
        return 413 '{"timestamp":null,"status":413,"code":"UPLOAD_TOO_LARGE","message":"The upload exceeds the 100 MB request limit","path":"/api/v1/jobs","details":{}}';
    }

    location @legacy_upload_too_large {
        default_type application/json;
        return 413 '{"success":false,"message":"File size exceeds the maximum allowed size.","outputFilename":null}';
    }

    # Increase client body size for file uploads
    client_max_body_size 100M;
}
