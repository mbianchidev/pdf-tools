name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install native document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-liberation \
            libreoffice-calc libreoffice-impress \
            libreoffice-writer qpdf util-linux

      - name: Run tests
        env:
          # Ubuntu 24 compiles setpriv without seccomp-filter support. Production
          # Docker remains fail-closed and exercises the network-denied path.
          REPAIR_ALLOW_UNSANDBOXED_LINUX: 'true'
        run: mvn -B test

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test

  html-converter-checks:
    name: HTML Converter Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: html-converter
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: html-converter/package-lock.json

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Install Chromium and PDF comparison tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Run browser integration test
        env:
          HTML_BROWSER_INTEGRATION: '1'
        run: node --test test/browser.integration.test.mjs

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks, html-converter-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build containers without cache
        run: docker compose build --no-cache
