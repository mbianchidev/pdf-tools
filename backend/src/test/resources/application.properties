spring.datasource.url=jdbc:h2:mem:pdftools;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
pdf.storage.type=local
pdf.storage.local-root=${java.io.tmpdir}/pdf-tools-test-storage
pdf.jobs.work-root=${java.io.tmpdir}/pdf-tools-test-work
pdf.jobs.enabled-operations=
pdf.jobs.options-key-file=${java.io.tmpdir}/pdf-tools-test-options.key
pdf.upload.dir=${java.io.tmpdir}/pdf-tools-test-legacy
spring.servlet.multipart.location=${java.io.tmpdir}/pdf-tools-test-multipart
cors.allowed-origins=http://localhost
logging.level.com.pdftools=WARN
