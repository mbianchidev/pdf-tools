spring.application.name=pdf-tools
server.port=8080

# Server
server.max-http-request-header-size=128KB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB
server.tomcat.max-part-count=110

# Keep bounded text metadata in memory; uploaded files spill after 64 KiB.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=65537B
spring.servlet.multipart.location=${PDF_MULTIPART_TEMP_DIR:/tmp/pdf-multipart}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pdftools}
spring.datasource.username=${DATABASE_USERNAME:pdftools}
spring.datasource.password=${DATABASE_PASSWORD:pdftools}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Legacy endpoint storage. New v1 jobs use pdf.storage.
pdf.upload.dir=${PDF_UPLOAD_DIR:/tmp/pdf-storage/legacy}

# Streaming artifact storage
pdf.storage.type=${PDF_STORAGE_TYPE:local}
pdf.storage.local-root=${PDF_STORAGE_LOCAL_ROOT:/tmp/pdf-storage/jobs}
pdf.storage.s3.endpoint=${PDF_STORAGE_S3_ENDPOINT:}
pdf.storage.s3.region=${PDF_STORAGE_S3_REGION:us-east-1}
pdf.storage.s3.bucket=${PDF_STORAGE_S3_BUCKET:pdf-tools}
pdf.storage.s3.access-key=${PDF_STORAGE_S3_ACCESS_KEY:}
pdf.storage.s3.secret-key=${PDF_STORAGE_S3_SECRET_KEY:}
pdf.storage.s3.path-style-access=${PDF_STORAGE_S3_PATH_STYLE_ACCESS:true}
pdf.storage.s3.create-bucket=${PDF_STORAGE_S3_CREATE_BUCKET:false}

# Asynchronous jobs
pdf.jobs.retention=2h
pdf.jobs.cleanup-interval=15m
pdf.jobs.dispatch-interval=1s
pdf.jobs.orphan-grace=30m
pdf.jobs.lease-duration=2m
pdf.jobs.lease-renew-interval=30s
pdf.jobs.sse-poll-interval=1s
pdf.jobs.max-files=100
pdf.jobs.max-file-size-bytes=104857600
pdf.jobs.work-root=${PDF_JOB_WORK_ROOT:/tmp/pdf-work}
pdf.jobs.executor-core-size=2
pdf.jobs.executor-max-size=4
pdf.jobs.executor-queue-capacity=20
pdf.jobs.enabled-operations=${PDF_ENABLED_OPERATIONS:merge,split,remove,rotate,organize,crop,page-numbers,protect}
pdf.jobs.options-encryption-key=${PDF_OPTIONS_ENCRYPTION_KEY:}
pdf.jobs.options-key-file=${PDF_OPTIONS_KEY_FILE:/tmp/pdf-storage/.options-key}

