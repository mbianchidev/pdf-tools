spring.application.name=pdf-tools
server.port=8080

# Server
server.max-http-request-header-size=128KB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB

# Multipart uploads spill to disk immediately.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.location=${PDF_MULTIPART_TEMP_DIR:/tmp/pdf-multipart}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pdftools}
spring.datasource.username=${DATABASE_USERNAME:pdftools}
spring.datasource.password=${DATABASE_PASSWORD:pdftools}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Legacy endpoint storage. New v1 jobs use pdf.storage.
pdf.upload.dir=${PDF_UPLOAD_DIR:/tmp/pdf-storage/legacy}

# Streaming artifact storage
pdf.storage.type=${PDF_STORAGE_TYPE:local}
pdf.storage.local-root=${PDF_STORAGE_LOCAL_ROOT:/tmp/pdf-storage/jobs}
pdf.storage.s3.endpoint=${PDF_STORAGE_S3_ENDPOINT:}
pdf.storage.s3.region=${PDF_STORAGE_S3_REGION:us-east-1}
pdf.storage.s3.bucket=${PDF_STORAGE_S3_BUCKET:pdf-tools}
pdf.storage.s3.access-key=${PDF_STORAGE_S3_ACCESS_KEY:}
pdf.storage.s3.secret-key=${PDF_STORAGE_S3_SECRET_KEY:}
pdf.storage.s3.path-style-access=${PDF_STORAGE_S3_PATH_STYLE_ACCESS:true}
pdf.storage.s3.create-bucket=${PDF_STORAGE_S3_CREATE_BUCKET:false}

# Asynchronous jobs
pdf.jobs.retention=2h
pdf.jobs.cleanup-interval=15m
pdf.jobs.dispatch-interval=1s
pdf.jobs.orphan-grace=30m
pdf.jobs.lease-duration=2m
pdf.jobs.lease-renew-interval=30s
pdf.jobs.sse-poll-interval=1s
pdf.jobs.max-files=20
pdf.jobs.max-file-size-bytes=104857600
pdf.jobs.work-root=${PDF_JOB_WORK_ROOT:/tmp/pdf-work}
pdf.jobs.executor-core-size=2
pdf.jobs.executor-max-size=4
pdf.jobs.executor-queue-capacity=20
pdf.jobs.enabled-operations=merge,split,remove,rotate,organize,crop

# Merge PDF
pdf.operations.merge.max-files=20
pdf.operations.merge.max-total-input-bytes=104857600
pdf.operations.merge.max-pages-per-file=10000
pdf.operations.merge.max-total-pages=20000

# Split PDF
pdf.operations.split.max-pages=1000
pdf.operations.split.max-outputs=500
pdf.operations.split.max-fixed-group-size=500
pdf.operations.split.max-output-bytes=134217728
pdf.operations.split.max-total-output-bytes=536870912
pdf.operations.split.max-decoded-page-bytes=33554432
pdf.operations.split.max-total-decoded-bytes=268435456
pdf.operations.split.max-resource-scratch-bytes=536870912
pdf.operations.split.max-content-tokens=250000
pdf.operations.split.max-content-streams-per-page=1000
pdf.operations.split.max-resource-depth=32
pdf.operations.split.max-resource-nodes=10000
pdf.operations.split.max-total-resource-nodes=1000000
pdf.operations.split.legacy-timeout=10m
pdf.operations.split.legacy-executor-core-size=1
pdf.operations.split.legacy-executor-max-size=2
pdf.operations.split.legacy-executor-queue-capacity=4

# Streaming downloads
pdf.download.async-timeout=2h
pdf.download.executor-core-size=4
pdf.download.executor-max-size=16
pdf.download.executor-queue-capacity=100

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80}

# Logging
logging.level.com.pdftools=${PDF_TOOLS_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
