spring.application.name=pdf-tools
server.port=8080

# Server
server.max-http-request-header-size=128KB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB
server.tomcat.max-part-count=110

# Keep bounded text metadata in memory; uploaded files spill after 64 KiB.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=65537B
spring.servlet.multipart.location=${PDF_MULTIPART_TEMP_DIR:/tmp/pdf-multipart}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pdftools}
spring.datasource.username=${DATABASE_USERNAME:pdftools}
spring.datasource.password=${DATABASE_PASSWORD:pdftools}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Legacy endpoint storage. New v1 jobs use pdf.storage.
pdf.upload.dir=${PDF_UPLOAD_DIR:/tmp/pdf-storage/legacy}

# Streaming artifact storage
pdf.storage.type=${PDF_STORAGE_TYPE:local}
pdf.storage.local-root=${PDF_STORAGE_LOCAL_ROOT:/tmp/pdf-storage/jobs}
pdf.storage.s3.endpoint=${PDF_STORAGE_S3_ENDPOINT:}
pdf.storage.s3.region=${PDF_STORAGE_S3_REGION:us-east-1}
pdf.storage.s3.bucket=${PDF_STORAGE_S3_BUCKET:pdf-tools}
pdf.storage.s3.access-key=${PDF_STORAGE_S3_ACCESS_KEY:}
pdf.storage.s3.secret-key=${PDF_STORAGE_S3_SECRET_KEY:}
pdf.storage.s3.path-style-access=${PDF_STORAGE_S3_PATH_STYLE_ACCESS:true}
pdf.storage.s3.create-bucket=${PDF_STORAGE_S3_CREATE_BUCKET:false}

# Asynchronous jobs
pdf.jobs.retention=2h
pdf.jobs.cleanup-interval=15m
pdf.jobs.dispatch-interval=1s
pdf.jobs.orphan-grace=30m
pdf.jobs.lease-duration=2m
pdf.jobs.lease-renew-interval=30s
pdf.jobs.sse-poll-interval=1s
pdf.jobs.max-files=100
pdf.jobs.max-file-size-bytes=104857600
pdf.jobs.work-root=${PDF_JOB_WORK_ROOT:/tmp/pdf-work}
pdf.jobs.executor-core-size=2
pdf.jobs.executor-max-size=4
pdf.jobs.executor-queue-capacity=20
pdf.jobs.enabled-operations=${PDF_ENABLED_OPERATIONS:merge,split,remove,rotate,organize,crop,page-numbers,protect}
pdf.jobs.options-encryption-key=${PDF_OPTIONS_ENCRYPTION_KEY:}
pdf.jobs.options-key-file=${PDF_OPTIONS_KEY_FILE:/tmp/pdf-storage/.options-key}

# PDF security
pdf.operations.security.max-output-bytes=${PDF_SECURITY_MAX_OUTPUT_BYTES:134217728}

# PDF to JPG
pdf.operations.pdf-to-jpg.max-document-pages=${PDF_TO_JPG_MAX_DOCUMENT_PAGES:1000}
pdf.operations.pdf-to-jpg.max-selected-pages=${PDF_TO_JPG_MAX_SELECTED_PAGES:500}
pdf.operations.pdf-to-jpg.min-dpi=72
pdf.operations.pdf-to-jpg.max-dpi=${PDF_TO_JPG_MAX_DPI:300}
pdf.operations.pdf-to-jpg.max-pixels-per-page=${PDF_TO_JPG_MAX_PIXELS_PER_PAGE:20000000}
pdf.operations.pdf-to-jpg.max-image-dimension=${PDF_TO_JPG_MAX_IMAGE_DIMENSION:16384}
pdf.operations.pdf-to-jpg.max-image-bytes=${PDF_TO_JPG_MAX_IMAGE_BYTES:52428800}
pdf.operations.pdf-to-jpg.max-total-image-bytes=${PDF_TO_JPG_MAX_TOTAL_IMAGE_BYTES:536870912}
pdf.operations.pdf-to-jpg.max-archive-bytes=${PDF_TO_JPG_MAX_ARCHIVE_BYTES:545259520}
pdf.operations.pdf-to-jpg.max-page-tree-nodes=10000
pdf.operations.pdf-to-jpg.max-page-tree-depth=32
pdf.operations.pdf-to-jpg.max-content-streams-per-page=1000
pdf.operations.pdf-to-jpg.max-worker-heap-bytes=${PDF_TO_JPG_MAX_WORKER_HEAP_BYTES:268435456}
pdf.operations.pdf-to-jpg.worker-timeout=${PDF_TO_JPG_WORKER_TIMEOUT:5m}

# JPG to PDF
pdf.operations.jpg-to-pdf.max-images=${JPG_TO_PDF_MAX_IMAGES:100}
pdf.operations.jpg-to-pdf.max-total-input-bytes=104857600
pdf.operations.jpg-to-pdf.max-image-dimension=${JPG_TO_PDF_MAX_IMAGE_DIMENSION:16384}
pdf.operations.jpg-to-pdf.max-pixels-per-image=${JPG_TO_PDF_MAX_PIXELS_PER_IMAGE:50000000}
pdf.operations.jpg-to-pdf.max-total-pixels=${JPG_TO_PDF_MAX_TOTAL_PIXELS:500000000}
pdf.operations.jpg-to-pdf.max-output-bytes=${JPG_TO_PDF_MAX_OUTPUT_BYTES:134217728}
pdf.operations.jpg-to-pdf.fit-image-dpi=96
pdf.operations.jpg-to-pdf.max-fit-page-points=1440
pdf.operations.jpeg-validation.max-progressive-coefficient-bytes=${JPG_TO_PDF_MAX_PROGRESSIVE_COEFFICIENT_BYTES:67108864}
pdf.operations.jpeg-validation.worker-heap-bytes=${JPG_TO_PDF_VALIDATION_WORKER_HEAP_BYTES:134217728}
pdf.operations.jpeg-validation.worker-timeout=${JPG_TO_PDF_VALIDATION_WORKER_TIMEOUT:2m}

# Watermark PDF
pdf.operations.watermark.max-image-bytes=${WATERMARK_MAX_IMAGE_BYTES:10485760}
pdf.operations.watermark.max-image-dimension=${WATERMARK_MAX_IMAGE_DIMENSION:4096}
pdf.operations.watermark.max-image-pixels=${WATERMARK_MAX_IMAGE_PIXELS:4000000}

# Edit PDF
pdf.operations.edit.max-elements=${EDIT_MAX_ELEMENTS:500}
pdf.operations.edit.max-images=${EDIT_MAX_IMAGES:10}
pdf.operations.edit.max-image-bytes=${EDIT_MAX_IMAGE_BYTES:10485760}
pdf.operations.edit.max-total-decoded-image-bytes=${EDIT_MAX_TOTAL_DECODED_IMAGE_BYTES:67108864}

# Secure Redact PDF
pdf.operations.redact.max-areas=${REDACT_MAX_AREAS:500}
pdf.operations.redact.max-areas-per-page=${REDACT_MAX_AREAS_PER_PAGE:100}
pdf.operations.redact.max-document-pages=${REDACT_MAX_DOCUMENT_PAGES:1000}
pdf.operations.redact.render-dpi=${REDACT_RENDER_DPI:200}
pdf.operations.redact.jpeg-quality=${REDACT_JPEG_QUALITY:95}
pdf.operations.redact.max-pixels-per-page=${REDACT_MAX_PIXELS_PER_PAGE:20000000}
pdf.operations.redact.max-image-dimension=${REDACT_MAX_IMAGE_DIMENSION:16384}
pdf.operations.redact.max-image-bytes=${REDACT_MAX_IMAGE_BYTES:52428800}
pdf.operations.redact.max-total-image-bytes=${REDACT_MAX_TOTAL_IMAGE_BYTES:536870912}
pdf.operations.redact.max-output-bytes=${REDACT_MAX_OUTPUT_BYTES:536870912}
pdf.operations.redact.max-page-tree-nodes=10000
pdf.operations.redact.max-page-tree-depth=32
pdf.operations.redact.max-content-streams-per-page=1000
pdf.operations.redact.worker-heap-bytes=${REDACT_WORKER_HEAP_BYTES:268435456}
pdf.operations.redact.worker-timeout=${REDACT_WORKER_TIMEOUT:5m}

# Merge PDF
pdf.operations.merge.max-files=20
pdf.operations.merge.max-total-input-bytes=104857600
pdf.operations.merge.max-pages-per-file=10000
pdf.operations.merge.max-total-pages=20000

# Split PDF
pdf.operations.split.max-pages=1000
pdf.operations.split.max-outputs=500
pdf.operations.split.max-fixed-group-size=500
pdf.operations.split.max-output-bytes=134217728
pdf.operations.split.max-total-output-bytes=536870912
pdf.operations.split.max-decoded-page-bytes=33554432
pdf.operations.split.max-total-decoded-bytes=268435456
pdf.operations.split.max-resource-scratch-bytes=536870912
pdf.operations.split.max-content-tokens=250000
pdf.operations.split.max-content-streams-per-page=1000
pdf.operations.split.max-resource-depth=32
pdf.operations.split.max-resource-nodes=10000
pdf.operations.split.max-total-resource-nodes=1000000
pdf.operations.split.legacy-timeout=10m
pdf.operations.split.legacy-executor-core-size=1
pdf.operations.split.legacy-executor-max-size=2
pdf.operations.split.legacy-executor-queue-capacity=4

# Streaming downloads
pdf.download.async-timeout=2h
pdf.download.executor-core-size=4
pdf.download.executor-max-size=16
pdf.download.executor-queue-capacity=100

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80}

# Logging
logging.level.com.pdftools=${PDF_TOOLS_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
